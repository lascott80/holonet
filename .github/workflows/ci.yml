name: CI

on:
  push:
    branches: [main, "milestone-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The target platform (GitHub-hosted Windows ARM64; confirmed available
          # to this private repository on 25 Nov 2026).
          - name: windows-arm64
            runner: windows-11-arm
            experimental: false
          - name: windows-x64
            runner: windows-latest
            experimental: false
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain none --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append $env:GITHUB_PATH
            $env:Path += ";$env:USERPROFILE\.cargo\bin"
          }
          rustup show active-toolchain || rustup toolchain install
          rustc -vV

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: matrix.name == 'windows-x64'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked
