[package]
name = "holonet-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
holonet-ssh = { version = "0.1.0", path = "../holonet-ssh" }
thiserror = "2.0.21"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[dev-dependencies]
anyhow = "1.0.105"
holonet-model = { path = "../holonet-model" }
# The WSL test support (holonet-ssh/tests/support) checks host keys with russh.
russh = "0.65.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
