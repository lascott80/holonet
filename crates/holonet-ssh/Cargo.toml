[package]
name = "holonet-ssh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
holonet-model = { version = "0.1.0", path = "../holonet-model" }
# rand 0.10 is the generator ssh-key 0.7 (inside russh) takes for key generation.
rand = "0.10"
russh = "0.65.4"
# SFTP (milestone 5).
russh-sftp = { version = "4.0.0", features = ["raw-string"] }
thiserror = "2.0.21"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
holonet-model = { path = "../holonet-model" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
