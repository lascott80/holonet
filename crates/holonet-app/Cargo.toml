[package]
name = "holonet-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "holonet"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1.0.105"
gpui.workspace = true
holonet-model = { version = "0.1.0", path = "../holonet-model" }
holonet-ssh = { version = "0.1.0", path = "../holonet-ssh" }
holonet-vault = { version = "0.1.0", path = "../holonet-vault" }
jiff = "1.0.3"
regex = "1.13"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
unicode-segmentation = "1.13.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Power", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
