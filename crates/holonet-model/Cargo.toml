[package]
name = "holonet-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Hashed known_hosts names (HMAC-SHA1, as OpenSSH writes them).
base64 = "0.23.1"
hmac = "0.13.0"
sha1 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
zeroize = { version = "1.9.2", features = ["serde"] }

[dev-dependencies]
serde_json = "1.0.154"
