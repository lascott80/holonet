<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SettingRow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
body{margin:0;padding:var(--space-5);background:var(--ground);color:var(--ink);font:14px/1.5 var(--font-sans);display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}button{font:inherit;cursor:pointer}
body{display:block}.box{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--card)}.r{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 16px;min-height:var(--control);border-bottom:1px solid var(--line)}.r:last-child{border-bottom:none}.h{font-size:12px;color:var(--ink-muted)}select{height:var(--control);background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:0 12px;color:var(--ink);font:14px var(--font-sans)}input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}.seg{display:flex;gap:6px}.seg button{height:var(--control);padding:0 14px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:var(--radius-md)}.seg .on{background:var(--raised);border-color:var(--accent)}
</style>
</head>
<body>
<div class="box"><label class="r"><span>Save terminal output to History<br><span class="h">Off by default. Logs can contain secrets.</span></span><input type="checkbox"></label><div class="r"><span>Cursor</span><span class="seg"><button class="on" aria-pressed="true">Block</button><button aria-pressed="false">Bar</button><button aria-pressed="false">Underline</button></span></div><div class="r"><label for="ka">Keep-alive interval</label><select id="ka"><option>30 seconds</option><option>60 seconds</option></select></div></div>
</body>
</html>
