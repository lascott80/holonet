<!-- @dsCard group="Overlays" height=300 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dialog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
body{margin:0;padding:var(--space-5);background:var(--ground);color:var(--ink);font:14px/1.5 var(--font-sans);display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}button{font:inherit;cursor:pointer}
body{align-items:flex-start;background:var(--sunken)}.d{width:360px;box-sizing:border-box;background:var(--card);border:1px solid var(--line-strong);border-radius:var(--radius-2xl);padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-4);box-shadow:var(--shadow-dialog)}.d.w{background:var(--warn-surface);border-color:var(--warn)}h2{margin:0;font:600 18px/1.3 var(--font-display)}p{margin:6px 0 0;color:var(--ink-muted)}.w p{color:var(--warn-ink)}.box{background:var(--ground);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;font:13px/1.7 var(--font-mono)}.r{display:flex;gap:8px}.b{flex:1;height:var(--control);border-radius:var(--radius-md);background:none;color:var(--ink);border:1px solid var(--line-strong)}.p{background:var(--accent);color:var(--on-accent);border:none;font-weight:600}.wf{background:var(--warn);color:var(--on-warn);border:none;font-weight:600}
</style>
</head>
<body>
<div class="d" role="dialog" aria-labelledby="a"><div><h2 id="a">Rename on nas-01</h2><p>Renames deploy.sh</p></div><div class="box">deploy.sh</div><div class="r"><button class="b">Cancel</button><button class="b p">Rename</button></div></div><div class="d w" role="alertdialog" aria-labelledby="b"><div><h2 id="b">Delete 2 items from nas-01?</h2><p>Files deleted over SFTP do not go to a recycle bin.</p></div><div class="box">robots.txt<br>releases/</div><div class="r"><button class="b">Cancel</button><button class="b wf">Delete</button></div></div>
</body>
</html>
