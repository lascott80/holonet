<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TransferRow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
body{margin:0;padding:var(--space-5);background:var(--ground);color:var(--ink);font:14px/1.5 var(--font-sans);display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}button{font:inherit;cursor:pointer}
body{display:block;padding:var(--space-4);}.q{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--card);overflow:hidden}.r{display:flex;align-items:center;gap:14px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line)}.r:last-child{border-bottom:none}.a{flex:1 1 200px}.b{flex:2 1 240px;display:flex;flex-direction:column;gap:6px}.m{font:12px var(--font-mono);color:var(--ink-muted)}.s{font-size:12px;color:var(--ink-muted)}.bar{height:4px;background:var(--line);border-radius:2px}.bar i{display:block;height:4px;border-radius:2px}.k{height:var(--control-compact);padding:0 10px;background:none;border:1px solid var(--line-strong);color:var(--ink);border-radius:var(--radius-md);font-size:13px}
</style>
</head>
<body>
<div class="q"><div class="r"><div class="a">assets.tar.gz<div class="m">This PC → nas-01</div></div><div class="b"><div class="bar"><i style="width:64%;background:var(--accent)"></i></div><div class="s">64% · 4.2 MB/s · 4 s left</div></div><button class="k">Pause</button></div><div class="r"><div class="a">nginx.conf<div class="m">nas-01 → This PC</div></div><div class="b"><div class="bar"></div><div class="s" style="color:var(--warn)">Failed: Permission denied</div></div><button class="k">Retry</button></div></div>
</body>
</html>
