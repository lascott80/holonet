<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HostCard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
body{margin:0;padding:var(--space-5);background:var(--ground);color:var(--ink);font:14px/1.5 var(--font-sans);display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}button{font:inherit;cursor:pointer}
.h{width:280px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-xl);padding:14px;color:var(--ink);display:flex;flex-direction:column;gap:12px}.h.on{background:var(--card-selected);border-color:var(--accent)}.top{display:flex;gap:12px;align-items:center}.tile{width:40px;height:40px;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;flex:none}.n{font-weight:600}.a{font:12px var(--font-mono);color:var(--ink-muted)}.f{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-muted);border-top:1px solid var(--line);padding-top:10px}.sq{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
</style>
</head>
<body>

</body>
</html>
