<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FileRow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
body{margin:0;padding:var(--space-5);background:var(--ground);color:var(--ink);font:14px/1.5 var(--font-sans);display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}button{font:inherit;cursor:pointer}
body{display:block;padding:0;background:var(--ground)}.r{display:grid;grid-template-columns:28px minmax(0,1fr) 90px 110px;gap:10px;align-items:center;min-height:var(--control);padding:0 14px;border-bottom:1px solid var(--line-soft)}.r.h{min-height:32px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);border-bottom-color:var(--line)}.r.on{background:var(--card-selected)}.n{display:flex;align-items:center;gap:10px}.m{font:12px var(--font-mono);color:var(--ink-muted)}input{width:16px;height:16px;accent-color:var(--accent);margin:0}
</style>
</head>
<body>
<div class="r h"><input type="checkbox" aria-label="Select all"><span>Name</span><span>Size</span><span>Permissions</span></div><label class="r"><input type="checkbox"><span class="n"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true" style="color:var(--accent)"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>releases</span><span class="m">Folder</span><span class="m">drwxr-xr-x</span></label><label class="r on"><input type="checkbox" checked><span class="n"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--group-mint)"><path d="M6 3h8l4 4v14H6zM14 3v4h4M10 12l-2 2 2 2M14 12l2 2-2 2"/></svg>deploy.sh</span><span class="m">940 B</span><span class="m">-rwxr-x---</span></label><label class="r"><input type="checkbox"><span class="n"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--ink-muted)"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 15h6"/></svg>robots.txt</span><span class="m">72 B</span><span class="m">-rw-r--r--</span></label>
</body>
</html>
