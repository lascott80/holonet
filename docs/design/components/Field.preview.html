<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
body{margin:0;padding:var(--space-5);background:var(--ground);color:var(--ink);font:14px/1.5 var(--font-sans);display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}button{font:inherit;cursor:pointer}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-muted);width:240px}input[type=text],select{height:var(--control);box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:0 12px;color:var(--ink);font:14px var(--font-sans);outline:none}input[type=text]:focus,select:focus{border-color:var(--accent)}.m{font-family:var(--font-mono) !important;font-size:13px !important}.c{flex-direction:row;align-items:center;gap:10px;font-size:14px;color:var(--ink);min-height:var(--control);width:auto}input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
</style>
</head>
<body>
<label>Label<input type="text" value="staging-worker-02"></label><label>Primary address<input class="m" type="text" value="10.30.0.9"></label><label>Group<select><option>Staging</option><option>Production</option></select></label><label class="c"><input type="checkbox" checked>Keep connection alive</label>
</body>
</html>
