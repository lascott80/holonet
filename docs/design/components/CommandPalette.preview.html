<!-- @dsCard group="Overlays" height=300 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CommandPalette</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
body{margin:0;padding:var(--space-5);background:var(--ground);color:var(--ink);font:14px/1.5 var(--font-sans);display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}button{font:inherit;cursor:pointer}
body{display:block;background:var(--sunken)}.p{max-width:520px;background:var(--card);border:1px solid var(--line-strong);border-radius:var(--radius-2xl);box-shadow:var(--shadow-dialog);overflow:hidden}.s{display:flex;align-items:center;gap:12px;padding:0 16px;height:52px;border-bottom:1px solid var(--line);color:var(--ink-muted);font-size:16px}.g{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);padding:12px 16px 6px}.i{display:flex;align-items:center;gap:10px;min-height:var(--control);padding:0 16px}.i.on{background:var(--raised)}.i span:nth-child(2){flex:1}.h{font-size:12px;color:var(--ink-muted)}.sq{width:8px;height:8px;border-radius:2px}.k{font:11px var(--font-mono);color:var(--ink-muted);border:1px solid var(--line-strong);border-radius:var(--radius-xs);padding:2px 6px}
</style>
</head>
<body>
<div class="p" role="dialog" aria-label="Command palette"><div class="s"><span style="flex:1">Search hosts, snippets and commands</span><span class="k">Esc</span></div><div class="g">Hosts</div><div class="i on"><span class="sq" style="background:var(--accent)"></span><span>prod-web-01</span><span class="h">Go to session</span><span class="k">Enter</span></div><div class="i"><span class="sq" style="background:var(--group-mint)"></span><span>nas-01</span><span class="h">Go to session</span></div><div class="g">Actions</div><div class="i"><span></span><span>New host</span><span class="k">Ctrl Shift N</span></div></div>
</body>
</html>
