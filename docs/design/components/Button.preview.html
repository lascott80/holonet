<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
body{margin:0;padding:var(--space-5);background:var(--ground);color:var(--ink);font:14px/1.5 var(--font-sans);display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}button{font:inherit;cursor:pointer}
.b{height:var(--control);padding:0 18px;border-radius:var(--radius-md);font-weight:500}.primary{background:var(--accent);color:var(--on-accent);border:none;font-weight:600}.secondary{background:none;color:var(--ink);border:1px solid var(--line-strong)}.quiet{background:none;color:var(--ink-muted);border:1px solid transparent}.danger{background:none;color:var(--warn);border:1px solid var(--warn-line)}.danger-fill{background:var(--warn);color:var(--on-warn);border:none;font-weight:600}.compact{height:var(--control-compact);padding:0 12px}.b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<button class="b primary">Connect</button><button class="b secondary">Open SFTP</button><button class="b quiet">Cancel</button><button class="b danger">Delete host</button><button class="b danger-fill">Delete 2 items</button><button class="b secondary compact">Rename</button>
</body>
</html>
